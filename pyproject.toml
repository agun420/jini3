[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-daybreak"
version = "1.0.2"
description = "Project Daybreak v6.3 paper production-candidate platform with cryptographic release gating"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
evaluator = [
  "openai>=2.0,<3",
]
recorder = [
  "alpaca-py==0.43.5",
  "psycopg[binary,pool]>=3.3.4,<4",
  "SQLAlchemy>=2.0.50,<2.1",
  "alembic>=1.18,<2",
]
execution = [
  "alpaca-py==0.43.5",
  "psycopg[binary,pool]>=3.3.4,<4",
]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=1.3",
  "hypothesis>=6.130",
]
dev = [
  "ruff>=0.12",
  "mypy>=1.15",
  "build>=1.2",
  "twine>=6.1",
  "pytest-cov>=6.0",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "detect-secrets>=1.5",
]

[project.scripts]
daybreak = "daybreak.cli:main"
daybreak-recorder = "daybreak_recorder.cli:main"
daybreak-scanner = "daybreak_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["daybreak*", "daybreak_contracts*", "daybreak_recorder*", "daybreak_evaluator*"]

[tool.setuptools.package-data]
daybreak_evaluator = ["resources/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_schemas.py" = ["E402"]
"scripts/generate_fixtures.py" = ["E402"]
"tests/recorder/test_adapter_helpers.py" = ["ASYNC110"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["migrations", "tests"]

[tool.coverage.run]
branch = true
omit = [
  "*/__main__.py",
  "*/cli.py",
  "*/schema.py",
  "*/persistence.py",
  "daybreak_recorder/util/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.daybreak.components]
recorder = "0.2.0"
contracts = "0.1.0"
feature_engine = "0.2.0"
evaluator = "0.3.0"
risk_engine = "0.4.0"
execution_engine = "0.5.0"
orchestration_engine = "0.6.0"
operations_engine = "0.7.0"
analytics_engine = "0.8.0"
release_engine = "1.0.2"
