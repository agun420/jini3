name: Deploy Daybreak Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/validate_dashboard.py"
      - "tests/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "scripts/validate_dashboard.py"
      - "tests/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static artifact (secrets, inline scripts, external assets, path escapes)
        run: python scripts/validate_dashboard.py
      - name: Check JavaScript module syntax
        run: |
          node --check dashboard/assets/data.mjs
          node --check dashboard/assets/app.mjs
      - name: Run data-layer tests
        run: node --test tests/dashboard/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
